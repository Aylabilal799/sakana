server {
    listen 0.0.0.0:6464;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/mia-videos-access.log;
    error_log /var/log/nginx/mia-videos-error.log warn;

    location = / {
        default_type text/plain;
        return 200 "Mia video hosting is online\n";
    }

    location /videos/ {
        alias /var/www/agnes-videos/;
        autoindex off;
        types {
            video/mp4 mp4;
            text/plain txt ass;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Accept-Ranges "bytes" always;
    }
}
