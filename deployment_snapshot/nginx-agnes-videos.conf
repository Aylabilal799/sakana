server {
    listen 6464;
    server_name _;

    location /videos/ {
        alias /var/www/agnes-videos/;
        autoindex off;
        types { video/mp4 mp4; }
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
    }

    location = / {
        return 404;
    }
}
